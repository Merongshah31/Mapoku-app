name: mapoku
description: "mapOKU — accessible route mapping for OKU users (iOS front end)."
publish_to: 'none'
version: 0.4.1+5

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8   # iOS-style icons
  provider: ^6.1.2          # app state
  flutter_map: ^8.3.0       # OpenStreetMap, same tiles as the web build (no API key)
  latlong2: ^0.9.1          # coordinates for flutter_map
  image_picker: ^1.1.2      # camera / photo library for reports
  geolocator: ^14.0.0       # GPS coordinates for new reports
  url_launcher: ^6.3.0      # call emergency contacts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Native launch screen (shown for a split second before Flutter starts).
# Optional: run `dart run flutter_native_splash:create` once to apply it,
# otherwise iOS shows a plain white screen before the in-app splash.
flutter_native_splash:
  color: "#F0EEE7"
  image: assets/images/mapoku_logo_large.png
  android_12:
    color: "#F0EEE7"
    image: assets/images/mapoku_logo_large.png

# Home-screen app icon. Run `dart run flutter_launcher_icons` once to apply.
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#E4EFE7"
  adaptive_icon_foreground: assets/images/app_icon.png
